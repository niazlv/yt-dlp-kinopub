# Publishes the package to PyPI through Trusted Publishing (OIDC): no API token is
# stored anywhere. PyPI must know this workflow first — register a publisher for the
# project "yt-dlp-kinopub" at https://pypi.org/manage/account/publishing/ with owner
# "niazlv", repository "yt-dlp-kinopub", workflow "publish.yml", environment "pypi".
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
