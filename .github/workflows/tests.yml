name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests drive YoutubeDL with plugin_dirs, which needs yt-dlp 2025.01 or newer;
      # the plugin itself runs on older releases.
      - run: python -m pip install --upgrade pip "yt-dlp>=2025.01.12"
      - run: python -m unittest discover -s tests -v
