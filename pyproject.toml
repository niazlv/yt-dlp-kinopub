[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-dlp-kinopub"
version = "0.1.0"
description = "yt-dlp extractor plugin for kino.pub / kino.watch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "niazlv", email = "niazlv03@gmail.com" }]
keywords = ["yt-dlp", "yt-dlp-plugins", "kinopub", "kino.pub", "kino.watch"]
dependencies = ["yt-dlp>=2024.03.10"]
classifiers = [
    "Environment :: Console",
    "Environment :: Plugins",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/niazlv/yt-dlp-kinopub"
Repository = "https://github.com/niazlv/yt-dlp-kinopub"
Issues = "https://github.com/niazlv/yt-dlp-kinopub/issues"
"CLI downloader" = "https://github.com/niazlv/kinopub-downloader"

[tool.hatch.build.targets.wheel]
packages = ["yt_dlp_plugins"]

[tool.hatch.build.targets.sdist]
include = ["yt_dlp_plugins/", "tests/", "README.md", "LICENSE", "pyproject.toml"]
